deck:
  title: "生成AIの社内導入に向けたPoC計画"
  mode: business

slides:
  - id: cover
    type: cover
    title: "生成AIの社内導入に向けたPoC計画"
    subtitle: "安全に、効果を測りながら進める10週間の実証"
    eyebrow: "AI ADOPTION STRATEGY"
    brand_side: right
    brand_shape: diagonal

  - id: agenda
    type: numbered_list
    density: standard
    title: "本日のご説明内容"
    primary_message: "背景から依頼事項まで、判断に必要な情報を順にご説明します"
    message_position: top
    items:
      - title: "背景と課題"
        body: "生成AI活用の必要性と社内の現状"
      - title: "PoCの目的とスコープ"
        body: "何を、どこまで検証するか"
      - title: "体制とスケジュール"
        body: "誰が、いつ、どう進めるか"
      - title: "評価指標とリスク対応"
        body: "成果と安全性をどう判断するか"
      - title: "想定コストと依頼事項"
        body: "ご承認いただきたい内容"

  - id: background
    type: comparison
    variant: asymmetric
    density: standard
    title: "外部環境の変化と社内の課題が重なっている"
    primary_message: "PoCを通じて、会社としての生成AI活用方針を早期に確立する必要がある"
    left:
      heading: "外部環境の変化"
      items:
        - title: "競合他社での活用進展"
          body: "業務プロセスへの生成AI組み込みが加速している"
        - title: "人材獲得競争の激化"
          body: "先進的な業務環境が採用力に影響し始めている"
        - title: "顧客期待値の上昇"
          body: "迅速な対応や高品質な成果物が前提になりつつある"
    right:
      heading: "社内の課題"
      items:
        - title: "定型業務の負荷"
          body: "資料作成や情報整理に多くの時間が割かれている"
        - title: "利用の属人化"
          body: "一部社員が個人判断でツールを使い始めている"
        - title: "ルール・基準の不在"
          body: "安全に使うための社内基準がまだない"

  - id: why_poc
    type: evidence_and_decision
    density: standard
    title: "全社一斉導入ではなく、小さく検証してから広げる"
    primary_message: "PoCで安全性と効果を確認し、本格導入の判断材料をそろえる"
    evidence_heading: "全社一斉導入を避ける理由"
    evidence:
      - title: "リスクの見極めが不十分"
        body: "情報管理や誤利用への対応が定まっていない"
      - title: "効果が未検証"
        body: "どの業務でどれだけの効果が出るか分からない"
      - title: "定着率が不透明"
        body: "利用ルールなしでは現場に浸透しない懸念がある"
    decision_heading: "推奨する進め方"
    decision_detail: "対象業務を絞ったPoCを10週間実施し、効果とリスクを確認したうえで本格展開の可否を判断する。"

  - id: scope
    type: scope_and_exclusions
    density: dense
    title: "検証範囲を絞り、判断に必要な材料を確実にそろえる"
    primary_message: "対象業務・部門・期間を明確にし、比較可能な形で効果を測定する"
    scope_heading: "PoC実施範囲"
    scope:
      - label: "対象業務"
        title: "文書要約・ドラフト作成"
        body: "利用頻度が高く、効果を測定しやすい業務から開始する"
      - label: "対象部門"
        title: "企画部 他1部門"
        body: "業務特性の異なる2部門で横断的に検証する"
      - label: "検証テーマ"
        title: "効率化・品質・安全運用"
        body: "3つの観点から総合的に評価する"
    period: "期間：準備2週｜実証6週｜評価2週（計10週）"
    exclusions_heading: "今回の対象外"
    exclusions:
      - "自動意思決定"
      - "顧客への直接送信"
      - "個人・要配慮情報の入力"
      - "全社への一斉展開"

  - id: org_roles
    type: org_layers
    density: standard
    title: "意思決定・運営・実行の役割を分離する"
    primary_message: "各層の責任を明確にし、迅速な判断と着実な実行を両立する"
    layers:
      - heading: "意思決定"
        title: "経営層 / PoC推進責任者"
        body: "予算承認と継続可否の最終判断"
      - heading: "運営管理"
        title: "企画部（事務局）"
        body: "進捗管理、効果測定、情報システム部門との調整"
    execution_heading: "業務実行"
    execution:
      - title: "対象部門A"
        body: "実業務での利用とフィードバック提供"
      - title: "対象部門B"
        body: "実業務での利用とフィードバック提供"
      - title: "情報システム部門"
        body: "利用環境の整備とセキュリティ確認"
      - title: "外部ベンダー"
        body: "ツール導入支援とノウハウ提供"

  - id: schedule
    type: process_with_gates
    density: dense
    title: "10週間で検証し、各ゲートで継続可否を判断する"
    primary_message: "各ゲートで安全性と効果を確認し、条件を満たす場合だけ次へ進む"
    phases:
      - title: "準備"
        label: "SETUP"
        weight: 2
        items:
          - "対象業務・利用者を確定"
          - "基準値と運用ルールを設定"
      - title: "実証"
        label: "EXECUTION"
        weight: 6
        items:
          - "実案件で生成AIを利用"
          - "時間・品質・修正内容を記録"
      - title: "評価"
        label: "EVALUATION"
        weight: 2
        items:
          - "効果とリスクを総合評価"
          - "継続・改善・終了を判断"
    gates:
      - title: "利用開始承認"
        position: 0.2
      - title: "中間レビュー"
        position: 0.5
      - title: "最終判定会議"
        position: 1.0

  - id: kpi
    type: table_with_conclusion
    density: dense
    title: "定量・定性の両面から効果を測定する"
    primary_message: "必須項目をすべて満たした場合に、本格導入の検討へ進める"
    columns:
      - key: criterion
        label: "評価項目"
        weight: 1.6
      - key: measure
        label: "確認方法"
        weight: 2.6
      - key: decision
        label: "判定"
        weight: 1
        align: center
    rows:
      - criterion: "作業時間削減"
        measure: "現行業務との所要時間比較"
        decision: "必須"
        _highlight: true
      - criterion: "品質維持"
        measure: "担当者レビューと修正量"
        decision: "必須"
      - criterion: "安全性"
        measure: "情報漏えい・誤送信の有無"
        decision: "必須"
      - criterion: "利用継続意向"
        measure: "利用率とアンケート結果"
        decision: "参考"

  - id: risks
    type: priority_actions
    density: standard
    title: "想定されるリスクには優先度に応じた対策を講じる"
    primary_message: "重大リスクへの対策を優先し、安全に検証を進める体制を整える"
    issues_heading: "想定リスク"
    actions_heading: "対応方針"
    top_priority: "最優先"
    issues:
      - priority: "最優先"
        title: "情報漏えい"
        body: "限定した情報以外を入力しない運用を徹底する"
      - priority: "優先"
        title: "誤った出力の利用"
        body: "生成物を確認せず外部へ送ってしまう"
      - priority: "優先"
        title: "利用の属人化"
        body: "担当者ごとに使い方や判断基準が異なる"
    actions:
      - "入力可能な情報範囲を事前に定め、利用ログを記録する（情報システム部門）"
      - "生成物は担当者が内容を確認してから外部へ送信する（対象部門）"
      - "利用ガイドラインを整備し、開始前に全員へ周知する（企画部）"

  - id: cost
    type: table_with_conclusion
    density: dense
    title: "PoC規模のため、コストは限定的に抑えられる"
    primary_message: "対象を絞ることで、追加人員なしに小規模な投資で検証を開始できる"
    columns:
      - key: item
        label: "項目"
        weight: 1.4
      - key: detail
        label: "内容"
        weight: 2.8
      - key: cost
        label: "概算費用"
        weight: 1.2
        align: center
    rows:
      - item: "ツール利用料"
        detail: "対象部門・10週間分のライセンス費用"
        cost: "小規模"
      - item: "推進体制人件費"
        detail: "事務局・対象部門の稼働（既存業務の一部として実施）"
        cost: "追加人員なし"
      - item: "導入支援"
        detail: "外部ベンダーによる初期設定・研修"
        cost: "小規模"
        _highlight: true

  - id: roadmap
    type: stage_track
    density: standard
    title: "PoCの結果を踏まえ、段階的に展開範囲を広げる"
    primary_message: "各段階の成功基準を満たした場合のみ、次のステップへ進む"
    stages:
      - label: "現在"
        title: "PoC"
        body: "2部門・限定業務で効果と安全性を検証する"
      - label: "STEP 1"
        title: "縮小展開"
        body: "効果が確認できた業務・部門から順次拡大する"
      - label: "STEP 2"
        title: "全社展開"
        body: "運用ルールを整備し、全社利用へ移行する"
    note: "移行条件：評価指標（KPI）の必須項目をすべて満たすこと"

  - id: next_steps
    type: numbered_list
    density: standard
    title: "本PoCの開始に向け、3点のご協力をお願いします"
    primary_message: "ご承認いただき次第、来月から準備フェーズを開始します"
    message_position: bottom
    items:
      - title: "予算承認"
        body: "ツール利用料・導入支援に関わる費用"
      - title: "対象部門の協力"
        body: "対象部門A・Bでの利用開始とフィードバック提出"
      - title: "開始時期の確定"
        body: "承認後、来月より準備フェーズへ着手"
