deck:
  title: "新規事業 市場参入検討"
  mode: business

slides:
  - id: cover
    type: cover
    title: "法人向けサブスク事業 参入検討"
    subtitle: "市場規模・競合環境・想定シナリオの整理"
    eyebrow: "BUSINESS DEVELOPMENT"
    brand_side: left
    brand_shape: diagonal

  - id: market_size
    type: funnel
    density: standard
    title: "市場規模の絞り込みと獲得可能性"
    primary_message: "3年目に初年度獲得社数の3倍を目指しても、獲得可能市場の1.4%にとどまる。市場規模は制約要因にならない"
    insight_heading: "読み取れること"
    insights:
      - "国内の対象事業所は42万社。うち当社が販路を持つ業種は9.8万社"
      - "予算規模・意思決定単位の条件を満たすのは2.1万社で、ここが実質の獲得可能市場"
      - "初年度目標100社は獲得可能市場の0.5%。市場の大きさより営業効率が論点になる"
    stages:
      - title: "国内の対象事業所（TAM）"
        value: 420000
        value_label: "42.0万社"
      - title: "販路を持つ業種（SAM）"
        value: 98000
        value_label: "9.8万社"
      - title: "予算・意思決定単位が合致（SOM）"
        value: 21000
        value_label: "2.1万社"
      - title: "初年度の獲得目標"
        value: 100
        value_label: "100社"

  - id: competitor
    type: table_with_insight
    density: dense
    title: "競合4社の価格帯と機能カバレッジ"
    primary_message: "中価格帯かつ導入支援つきという領域が空いている。ここを狙う"
    insight_heading: "読み取れること"
    insights:
      - "月額3万円未満はセルフサーブ型に集中し、導入支援を提供する社がない"
      - "導入支援を持つ2社はいずれも月額10万円超で、中堅企業には手が届かない"
      - "当社の想定価格帯（月額4〜6万円）に正面から競合する社は現時点でいない"
      - "ただしD社が下位プラン投入を公表しており、12か月以内に競合化する可能性がある"
    columns:
      - key: name
        label: "社名"
        weight: 1
      - key: price
        label: "月額価格帯"
        weight: 1.3
      - key: support
        label: "導入支援"
        weight: 1
        align: center
      - key: share
        label: "推定シェア"
        weight: 1
        align: center
      - key: note
        label: "特徴"
        weight: 2.4
    rows:
      - name: "A社"
        price: "1.2〜2.4万円"
        support: "なし"
        share: "28%"
        note: "セルフサーブ特化。中小企業に強いが解約率が高い"
      - name: "B社"
        price: "1.8〜2.9万円"
        support: "なし"
        share: "19%"
        note: "会計ソフト連携が強み。単体では機能が限定的"
      - name: "C社"
        price: "11〜18万円"
        support: "あり"
        share: "12%"
        note: "大企業向け。専任コンサルがつくが導入に半年かかる"
      - name: "D社"
        price: "9〜15万円"
        support: "あり"
        share: "8%"
        note: "下位プラン投入を公表済み。最も警戒すべき競合"
        _highlight: true
      - name: "当社（想定）"
        price: "4〜6万円"
        support: "あり"
        share: "—"
        note: "導入支援を標準化し、2週間で立ち上がる構成にする"

  - id: scenario
    type: comparison
    density: dense
    variant: balanced
    title: "2つの参入シナリオ"
    primary_message: "初年度の赤字幅は自社開発が大きいが、3年目以降の利益率と撤退容易性で提携型を上回る"
    left:
      heading: "シナリオ1: 自社開発"
      items:
        - title: "初期投資 2.4億円 / 立ち上げ18か月"
          body: "開発要員12名を新規採用。既存プロダクトの基盤を一部流用する"
        - title: "3年目営業利益率 22%"
          body: "ライセンス費用が不要なため、社数が増えるほど利益率が改善する"
        - title: "撤退時の損失 1.8億円"
          body: "採用した要員の再配置先を確保できれば圧縮可能"
        - title: "機能の自由度が高い"
          body: "既存顧客の要望を直接反映でき、差別化を作りやすい"
    right:
      heading: "シナリオ2: 他社提携（OEM）"
      items:
        - title: "初期投資 6,000万円 / 立ち上げ6か月"
          body: "提携先の製品にブランドを載せる。開発要員の新規採用は不要"
        - title: "3年目営業利益率 11%"
          body: "売上の35%をライセンス費用として支払うため上限がある"
        - title: "撤退時の損失 4,000万円"
          body: "契約解除は1年前通知。在庫リスクを持たない"
        - title: "機能の自由度が低い"
          body: "提携先のロードマップに依存し、独自要望は反映されにくい"

  - id: decision
    type: evidence_and_decision
    density: standard
    title: "推奨する参入方針"
    primary_message: "提携型で6か月以内に市場性を検証し、社数が閾値を超えた時点で自社開発へ切り替える"
    evidence_heading: "この判断の根拠"
    evidence:
      - title: "市場性の不確実性が最大のリスク"
        body: "獲得可能市場は十分だが、想定価格帯での需要は未検証。先に2.4億を投じる合理性が薄い"
      - title: "提携型は撤退コストが4分の1以下"
        body: "検証で見込みが立たない場合の損失を4,000万円に抑えられる"
      - title: "切り替えの判断材料が6か月で揃う"
        body: "受注率・解約率・導入工数の3指標で、自社開発の投資判断ができる"
    decision_heading: "推奨する進め方"
    decision_detail: "まず提携型で参入し、6か月時点で契約社数60社・月次解約率2%未満を満たせば自社開発へ移行する。満たさない場合は提携を継続するか撤退を判断する。"

  - id: next
    type: priority_actions
    density: standard
    title: "着手前に解消すべき課題"
    primary_message: "提携先との条件交渉を最優先とし、他2件は交渉と並行して進める"
    issues_heading: "未解決の課題"
    issues:
      - priority: "最優先"
        title: "提携先の選定と条件交渉"
        body: "ライセンス料率35%は交渉余地がある。自社開発への切替条項も必須"
      - priority: "高"
        title: "営業体制の確保"
        body: "既存営業の兼務では初年度100社に届かない。専任3名の配置が必要"
      - priority: "中"
        title: "既存事業とのカニバリ検証"
        body: "既存顧客の一部が乗り換える可能性。影響額の試算が未着手"
    actions_heading: "並行して進めること"
    actions:
      - "提携候補2社へ条件提示を依頼し、6週間以内に比較する"
      - "営業専任3名の要員計画を人事と調整する"
      - "既存顧客20社へのヒアリングでカニバリ影響を試算する"
      - "6か月時点の判断基準（60社・解約率2%）を経営会議で合意しておく"
