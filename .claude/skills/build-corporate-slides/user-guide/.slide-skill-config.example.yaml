python:
  executable: "./.venv/bin/python" # Windows: ./.venv/Scripts/python.exe

paths:
  input_dir: "./build_slides/input"
  work_dir: "./build_slides/work"
  output_dir: "./build_slides/output"

organization:
  department: "企画部"
  classification: "部外秘"

deck:
  # 個人PC・事前配布・画面共有を標準とする。
  mode: "business"

typography:
  # 利用端末に導入済みの日本語フォントを指定する。
  headline_font: "Hiragino Sans"
  body_font: "Hiragino Sans"
  editorial_font: "Hiragino Mincho ProN"

branding:
  logo:
    enabled: true
    # 通常はここを指定しなくてよい。input_dir直下に company-logo.png
    # という名前で正式ロゴを置くだけで自動的に使われる（差し替える場合も
    # 同じファイル名へ上書きするだけでよい）。どちらも無ければSkill同梱の
    # assets/logo-placeholder.png を使用する。
    # この既定の名前・場所を使いたくない場合だけ、ここへ別のパスを指定する。
    path:
