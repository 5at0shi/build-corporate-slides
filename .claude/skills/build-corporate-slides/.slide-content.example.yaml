deck:
  title: "生成AIの社内導入"
  mode: business

slides:
  - id: cover
    type: cover
    title: "生成AIの社内導入"
    subtitle: "PoCから定着までの実行計画"
    eyebrow: "STRATEGY & IMPLEMENTATION"
    brand_side: right
    brand_shape: diagonal

  - id: value_and_risk
    type: comparison
    variant: asymmetric
    density: standard
    title: "なぜ今、生成AIを検証するのか"
    primary_message: "PoCで、会社として安全に成果を出せる使い方を決める"
    left:
      heading: "期待される業務価値"
      items:
        - title: "作業時間の短縮"
          body: "文書作成や要約にかかる時間を削減"
        - title: "品質の標準化"
          body: "担当者による成果物のばらつきを抑制"
        - title: "知識活用の促進"
          body: "社内情報を必要な場面で利用しやすくする"
    right:
      heading: "放置した場合のリスク"
      items:
        - title: "個別利用の拡大"
          body: "管理されない利用が先行する"
        - title: "判断基準の不在"
          body: "部門ごとに異なる運用が定着する"
        - title: "改善速度の低下"
          body: "業務変革の機会を逃す"

  - id: initial_scope
    type: evidence_and_decision
    density: standard
    title: "初回PoCは文書業務から始める"
    primary_message: "文書要約とドラフト作成を、最初の検証対象とする"
    evidence_heading: "選定の根拠"
    evidence:
      - title: "利用頻度が高い"
        body: "日常業務で繰り返し発生し、効果を継続的に測れる"
      - title: "比較条件をそろえやすい"
        body: "現行工数と生成結果を同じ案件で比較できる"
      - title: "人の確認を残せる"
        body: "外部利用前に担当者が内容を確認できる"
    decision_heading: "推奨する初回スコープ"
    decision_detail: "効果測定とリスク管理を両立しやすく、10週間で継続判断に必要な材料をそろえられる。"

  - id: scope_boundary
    type: scope_and_exclusions
    density: dense
    title: "検証範囲を限定し、安全性と効果を同時に確認する"
    primary_message: "AIは下書きまで。判断と外部利用は人が担う"
    scope_heading: "PoC実施範囲"
    scope:
      - label: "INPUT"
        title: "限定した社内文書"
        body: "機密区分と利用者を事前に定める"
      - label: "PROCESS"
        title: "要約・ドラフト"
        body: "入力、出力、修正内容を記録する"
      - label: "OUTPUT"
        title: "人が最終確認"
        body: "判断責任と外部送信は担当者に残す"
    period: "期間：準備2週｜実証6週｜評価2週（計10週）"
    exclusions_heading: "今回の対象外"
    exclusions:
      - "自動意思決定"
      - "顧客への直接送信"
      - "個人・要配慮情報"
      - "学習目的の無断転用"

  - id: execution_plan
    type: process_with_gates
    density: dense
    title: "10週間で検証し、段階的に継続可否を判断する"
    primary_message: "各ゲートで安全性と効果を確認し、条件を満たす場合だけ次へ進む"
    phases:
      - title: "準備"
        label: "SETUP"
        weight: 2
        items:
          - "対象業務と利用者を確定"
          - "基準値と運用ルールを設定"
      - title: "実証"
        label: "EXECUTION"
        weight: 6
        items:
          - "実案件で生成AIを利用"
          - "時間、品質、修正内容を記録"
      - title: "評価"
        label: "EVALUATION"
        weight: 2
        items:
          - "効果とリスクを総合評価"
          - "継続、改善、終了を判断"
    gates:
      - title: "利用開始承認"
        position: 0.2
      - title: "中間レビュー"
        position: 0.5
      - title: "最終判定会議"
        position: 1.0

  - id: evaluation_table
    type: table_with_conclusion
    density: dense
    title: "効果と安全性の両方を満たす場合だけ継続する"
    primary_message: "必須条件を一つでも満たさない場合は、改善または終了を判断する"
    columns:
      - key: criterion
        label: "評価項目"
        weight: 1.6
      - key: measure
        label: "確認方法"
        weight: 2.5
      - key: decision
        label: "判断"
        weight: 1
        align: center
    rows:
      - criterion: "時間短縮"
        measure: "現行業務との所要時間比較"
        decision: "必須"
        _highlight: true
      - criterion: "品質維持"
        measure: "担当者レビューと修正量"
        decision: "必須"
      - criterion: "安全性"
        measure: "情報漏えい・誤送信の有無"
        decision: "必須"
      - criterion: "利用継続性"
        measure: "利用率と担当者ヒアリング"
        decision: "参考"

  - id: chart_result
    type: chart_with_insight
    variant: standard
    density: standard
    title: "効果の全体像を確認し、継続判断につなげる"
    primary_message: "時間短縮だけでなく、品質と利用継続性を合わせて評価する"
    image: "chart-standard.png"
    insight_heading: "確認するポイント"
    insights:
      - "業務別の時間短縮率"
      - "修正量と品質評価"
      - "継続利用の意向"
