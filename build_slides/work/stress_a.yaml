deck:
  title: "基幹システム刷新 中間報告"
  mode: business

slides:
  - id: cover
    type: cover
    title: "基幹システム刷新 中間報告"
    subtitle: "フェーズ2完了時点の進捗・課題・投資判断のお願い"
    eyebrow: "STEERING COMMITTEE"
    brand_side: right
    brand_shape: diagonal

  - id: vendor_eval
    type: table_with_conclusion
    density: dense
    title: "ベンダー3社の評価結果"
    primary_message: "初期費用はB社が最安だが、5年総保有コストと内製移行のしやすさでA社を推奨する"
    columns:
      - key: item
        label: "評価項目"
        weight: 1.8
      - key: a
        label: "A社"
        weight: 1
        align: center
      - key: b
        label: "B社"
        weight: 1
        align: center
      - key: c
        label: "C社"
        weight: 1
        align: center
      - key: note
        label: "評価コメント"
        weight: 2.6
    rows:
      - item: "初期構築費用"
        a: "1.8億"
        b: "1.4億"
        c: "2.1億"
        note: "B社が最安。ただし追加開発の単価が他社比1.4倍"
      - item: "5年総保有コスト"
        a: "3.2億"
        b: "3.9億"
        c: "3.4億"
        note: "運用・保守・追加開発を含むとA社が最も低い"
        _highlight: true
      - item: "既存資産の移行性"
        a: "○"
        b: "△"
        c: "○"
        note: "B社は現行DBスキーマの一部を再設計する必要がある"
      - item: "内製移行のしやすさ"
        a: "○"
        b: "×"
        c: "△"
        note: "A社は設計書・テストコードの全量納品に対応"
      - item: "類似業種の実績"
        a: "12件"
        b: "31件"
        c: "6件"
        note: "B社が最多だが、当社規模での実績は3社とも同程度"
      - item: "障害時のSLA"
        a: "99.9%"
        b: "99.5%"
        c: "99.9%"
        note: "基幹系の停止許容時間から99.9%以上を必須条件とする"
      - item: "要員体制"
        a: "8名"
        b: "12名"
        c: "5名"
        note: "C社は繁忙期の増員可否が未回答。継続確認中"

  - id: risk_matrix
    type: matrix
    density: dense
    rows: 3
    cols: 3
    title: "移行リスクの評価と対応方針"
    primary_message: "発生確率・影響度がともに高いデータ移行と業務停止の2件へ、要員と予備期間を優先配分する"
    x_axis:
      low: "影響度: 小"
      high: "影響度: 大"
    y_axis:
      low: "発生確率: 低"
      high: "発生確率: 高"
    # cellsは左上から読み順。先頭行がy_axis.high（発生確率:高）側。
    cells:
      # 1行目 = 発生確率:高
      - label: "対応"
        title: "夜間バッチの遅延"
        body: "処理分割を設計へ反映"
      - label: "最優先"
        title: "データ移行の精度"
        body: "件数・金額の全件照合を3回実施する"
        emphasis: true
      - label: "最優先"
        title: "切替時の業務停止"
        body: "48時間以内に戻せる切り戻し手順を用意する"
        emphasis: true
      # 2行目 = 発生確率:中
      - label: "受容"
        title: "マスタ重複"
        body: "移行前クレンジングで解消"
      - label: "監視"
        title: "外部連携の仕様差"
        body: "接続テスト期間を2週確保"
      - label: "対応"
        title: "並行稼働期間の負荷"
        body: "現場の残業増を想定し要員を追加"
      # 3行目 = 発生確率:低
      - label: "受容"
        title: "帳票レイアウト差異"
        body: "現場調整で吸収可能"
      - label: "監視"
        title: "画面操作性の低下"
        body: "研修で補える範囲"
      - label: "監視"
        title: "権限設計の見直し"
        body: "監査要件との整合を確認"

  - id: phase_plan
    type: process_with_gates
    density: dense
    title: "フェーズ3以降の進め方と判断ポイント"
    primary_message: "各ゲートで移行精度と業務影響を確認し、条件を満たさない場合は切替時期を後ろ倒しする"
    phases:
      - title: "詳細設計"
        label: "PHASE 3"
        weight: 3
        items:
          - "業務フロー30本の確定"
          - "外部連携14系統の仕様凍結"
          - "移行対象データの範囲確定"
      - title: "構築・単体"
        label: "PHASE 4"
        weight: 4
        items:
          - "機能開発と単体テスト"
          - "移行ツールの作成"
          - "現場向け操作研修の教材作成"
      - title: "統合・移行リハ"
        label: "PHASE 5"
        weight: 3
        items:
          - "全件照合を3回実施"
          - "切り戻し手順の実地検証"
          - "並行稼働2週間"
    gates:
      - title: "設計凍結"
        position: 0.28
      - title: "移行判定1回目"
        position: 0.62
      - title: "本番切替可否"
        position: 1.0

  - id: budget
    type: stat_highlight
    density: standard
    title: "投資額と現時点の消化状況"
    primary_message: "予備費を含めた総額は当初計画内。フェーズ3の追加要員分としてご承認をお願いしたい"
    stat:
      value: "+4,200万"
      label: "フェーズ3で追加承認をお願いする金額"
      detail: "内訳: 移行要員2名×6か月 2,800万 / 予備期間2週の体制維持 1,400万"
      tone: warning
    supporting:
      - value: "62%"
        label: "総予算の消化率（計画比 -3pt）"
        tone: positive
      - value: "0件"
        label: "重大インシデント"
        tone: positive
      - value: "3件"
        label: "未解決の仕様課題"
        tone: negative

  - id: asks
    type: numbered_list
    density: standard
    message_position: bottom
    title: "本日ご判断いただきたいこと"
    primary_message: "上記3点について、本日の委員会でご承認をお願いします"
    items:
      - title: "ベンダーをA社に確定する"
        body: "5年総保有コストと内製移行のしやすさを重視した評価結果による"
      - title: "フェーズ3の追加予算4,200万を承認する"
        body: "データ移行の全件照合と切り戻し検証に要員を厚く配分するため"
      - title: "本番切替の判断を第3四半期末に設定する"
        body: "移行リハーサルの結果を見てから最終判断できるようにする"
