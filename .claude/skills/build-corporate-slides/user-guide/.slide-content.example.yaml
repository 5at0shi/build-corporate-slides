deck:
  title: "生成AIの社内導入"
  mode: business

slides:
  - id: cover
    type: cover
    title: "生成AIの社内導入"
    subtitle: "PoCから定着までの実行計画"
    eyebrow: "STRATEGY & IMPLEMENTATION"
    brand_side: right
    brand_shape: diagonal

  - id: value_and_risk
    type: comparison
    variant: asymmetric
    density: standard
    title: "なぜ今、生成AIを検証するのか"
    primary_message: "PoCで、会社として安全に成果を出せる使い方を決める"
    left:
      heading: "期待される業務価値"
      items:
        - title: "作業時間の短縮"
          body: "文書作成や要約にかかる時間を削減"
        - title: "品質の標準化"
          body: "担当者による成果物のばらつきを抑制"
        - title: "知識活用の促進"
          body: "社内情報を必要な場面で利用しやすくする"
    right:
      heading: "放置した場合のリスク"
      items:
        - title: "個別利用の拡大"
          body: "管理されない利用が先行する"
        - title: "判断基準の不在"
          body: "部門ごとに異なる運用が定着する"
        - title: "改善速度の低下"
          body: "業務変革の機会を逃す"

  - id: initial_scope
    type: evidence_and_decision
    density: standard
    title: "初回PoCは文書業務から始める"
    primary_message: "文書要約とドラフト作成を、最初の検証対象とする"
    evidence_heading: "選定の根拠"
    evidence:
      - title: "利用頻度が高い"
        body: "日常業務で繰り返し発生し、効果を継続的に測れる"
      - title: "比較条件をそろえやすい"
        body: "現行工数と生成結果を同じ案件で比較できる"
      - title: "人の確認を残せる"
        body: "外部利用前に担当者が内容を確認できる"
    decision_heading: "推奨する初回スコープ"
    decision_detail: "効果測定とリスク管理を両立しやすく、10週間で継続判断に必要な材料をそろえられる。"

  - id: scope_boundary
    type: scope_and_exclusions
    density: dense
    title: "検証範囲を限定し、安全性と効果を同時に確認する"
    primary_message: "AIは下書きまで。判断と外部利用は人が担う"
    scope_heading: "PoC実施範囲"
    scope:
      - label: "INPUT"
        title: "限定した社内文書"
        body: "機密区分と利用者を事前に定める"
      - label: "PROCESS"
        title: "要約・ドラフト"
        body: "入力、出力、修正内容を記録する"
      - label: "OUTPUT"
        title: "人が最終確認"
        body: "判断責任と外部送信は担当者に残す"
    period: "期間：準備2週｜実証6週｜評価2週（計10週）"
    exclusions_heading: "今回の対象外"
    exclusions:
      - "自動意思決定"
      - "顧客への直接送信"
      - "個人・要配慮情報"
      - "学習目的の無断転用"

  - id: execution_plan
    type: process_with_gates
    density: dense
    title: "10週間で検証し、段階的に継続可否を判断する"
    primary_message: "各ゲートで安全性と効果を確認し、条件を満たす場合だけ次へ進む"
    phases:
      - title: "準備"
        label: "SETUP"
        weight: 2
        items:
          - "対象業務と利用者を確定"
          - "基準値と運用ルールを設定"
      - title: "実証"
        label: "EXECUTION"
        weight: 6
        items:
          - "実案件で生成AIを利用"
          - "時間、品質、修正内容を記録"
      - title: "評価"
        label: "EVALUATION"
        weight: 2
        items:
          - "効果とリスクを総合評価"
          - "継続、改善、終了を判断"
    gates:
      - title: "利用開始承認"
        position: 0.2
      - title: "中間レビュー"
        position: 0.5
      - title: "最終判定会議"
        position: 1.0

  - id: evaluation_table
    type: table_with_conclusion
    density: dense
    title: "効果と安全性の両方を満たす場合だけ継続する"
    primary_message: "必須条件を一つでも満たさない場合は、改善または終了を判断する"
    columns:
      - key: criterion
        label: "評価項目"
        weight: 1.6
      - key: measure
        label: "確認方法"
        weight: 2.5
      - key: decision
        label: "判断"
        weight: 1
        align: center
    rows:
      - criterion: "時間短縮"
        measure: "現行業務との所要時間比較"
        decision: "必須"
        _highlight: true
      - criterion: "品質維持"
        measure: "担当者レビューと修正量"
        decision: "必須"
      - criterion: "安全性"
        measure: "情報漏えい・誤送信の有無"
        decision: "必須"
      - criterion: "利用継続性"
        measure: "利用率と担当者ヒアリング"
        decision: "参考"

  - id: department_results
    type: table_with_insight
    density: dense
    title: "部門別のPoC結果から、展開時の優先順位を考える"
    primary_message: "効果は部門で差がある。展開順は効果の大きさでなく、定着のしやすさも合わせて判断する"
    insight_heading: "読み取れること"
    insights:
      - "法務部は削減率が最も高いが、継続利用率は最も低い（定着に課題がある）"
      - "営業部は削減率・利用率ともに安定しており、次の展開先として扱いやすい"
      - "人事部は検証件数が少なく、効果の判断にはもう1四半期の観察が必要"
    columns:
      - key: dept
        label: "部門"
        weight: 1.2
      - key: reduction
        label: "所要時間削減率"
        weight: 1
      - key: usage
        label: "継続利用率"
        weight: 1
      - key: count
        label: "検証件数"
        weight: 1
    rows:
      - dept: "営業部"
        reduction: "-34%"
        usage: "88%"
        count: "24件"
        _highlight: true
      - dept: "法務部"
        reduction: "-45%"
        usage: "52%"
        count: "12件"
      - dept: "人事部"
        reduction: "-28%"
        usage: "70%"
        count: "6件"

  - id: chart_result
    type: chart_with_insight
    variant: standard
    density: standard
    title: "効果の全体像を確認し、継続判断につなげる"
    primary_message: "時間短縮だけでなく、品質と利用継続性を合わせて評価する"
    # chartはネイティブPowerPointグラフとして生成され、数値をPowerPoint上で
    # 直接編集できる（原則こちらを使う。事前生成PNGしかない場合だけimageを使う）。
    chart:
      type: column
      categories: ["文書要約", "ドラフト作成", "議事録整理"]
      series:
        - name: "所要時間削減率(%)"
          values: [42, 35, 38]
    insight_heading: "確認するポイント"
    insights:
      - "業務別の時間短縮率"
      - "修正量と品質評価"
      - "継続利用の意向"

  - id: poc_result
    type: stat_highlight
    density: standard
    title: "PoCは主要指標を満たし、本格展開の判断材料がそろった"
    primary_message: "効果・安全性ともに継続基準を満たし、本格展開を提案する"
    stat:
      value: "-38%"
      label: "対象業務の所要時間削減率"
      detail: "10週間・3部門・のべ42名で検証"
      tone: positive
    supporting:
      - value: "0件"
        label: "情報漏えい・誤送信"
      - value: "91%"
        label: "継続利用の意向"

  - id: cost_bridge
    type: waterfall
    density: standard
    title: "全社展開後の年間コストは、削減効果が追加費用を上回る"
    primary_message: "削減効果1.8億に対し追加費用は0.7億で、年1.1億の改善になる"
    bars:
      - label: "現行の年間費用"
        value: 620
        kind: total
        value_label: "6.2億"
      - label: "作業時間の削減"
        value: -180
        value_label: "-1.8億"
        tone: positive
      - label: "ライセンス費"
        value: 48
        value_label: "+0.48億"
        tone: negative
      - label: "研修・サポート"
        value: 22
        value_label: "+0.22億"
        tone: negative
      - label: "展開後の年間費用"
        value: 510
        kind: total
        value_label: "5.1億"

  - id: expansion_issues
    type: issue_tree
    density: standard
    title: "展開判断で答えを出すべき論点を分解する"
    primary_message: "効果はPoCで確認済み。残る論点は運用コストと管理体制に絞られる"
    root:
      label: "論点"
      title: "全社展開に踏み切ってよいか"
      body: "効果・コスト・管理の3方向へ分解する"
    branches:
      - title: "効果は再現するか"
        body: "PoC 3部門の結果が他部門でも出るか"
        items:
          - "業務の定型度合いの違い"
          - "利用者の習熟にかかる期間"
      - title: "コストは見合うか"
        body: "削減効果と追加費用の差分"
        items:
          - "ライセンス費用の総額"
          - "研修・サポートの運営費"
      - title: "管理を保てるか"
        items:
          - "入力可能な情報範囲の線引き"
          - "利用状況の監査手段"

  - id: next_use_cases
    type: matrix
    density: standard
    title: "次に検証する候補ユースケースを整理する"
    primary_message: "効果が大きく着手しやすいものから、次のPoCに進める"
    x_axis:
      low: "着手しやすさ: 低"
      high: "着手しやすさ: 高"
    y_axis:
      low: "期待効果: 小"
      high: "期待効果: 大"
    cells:
      - label: "優先"
        title: "問い合わせ対応の下書き"
        body: "定型的な回答が多く、効果を測定しやすい"
        emphasis: true
      - label: "検討"
        title: "議事録の要約"
        body: "効果は大きいが、機密区分の整理に時間がかかる"
      - label: "保留"
        title: "資料の多言語翻訳"
        body: "対象業務が限られ、優先度は相対的に低い"
      - label: "対象外"
        title: "契約書のレビュー"
        body: "法務判断を伴うため、当面は対象外とする"

  - id: rollout_section
    type: section_divider
    title: "本格展開に向けて"
    kicker: "SECTION 2"
    subtitle: "PoCの結果を踏まえた、次のステップ"

  - id: governance
    type: org_layers
    density: standard
    title: "本格展開はガバナンス体制を明確にして進める"
    primary_message: "意思決定と現場運用の責任を分け、拡大しても管理を保つ"
    layers:
      - heading: "意思決定"
        title: "AI活用推進委員会"
        body: "利用範囲の承認、リスク対応方針の決定を担う"
      - heading: "運営"
        title: "情報システム部門"
        body: "利用状況のモニタリングと問い合わせ対応を担う"
    execution_heading: "現場実行"
    execution:
      - title: "各部門の推進担当者"
        body: "自部門での利用定着とフィードバック収集"
      - title: "利用者"
        body: "ガイドラインに沿った日常利用"

  - id: rollout_stages
    type: stage_track
    density: standard
    title: "PoCから全社利用まで、段階的に対象を広げる"
    primary_message: "各段階の基準を満たしてから、次の範囲へ進む"
    stages:
      - label: "STEP1"
        title: "PoC（実施済み）"
        body: "3部門・文書業務に限定して検証"
      - label: "STEP2"
        title: "部門展開"
        body: "類似業務を持つ部門へ順次拡大"
        items:
          - "対象部門ごとに推進担当者を任命"
          - "利用状況を月次で共有"
      - label: "STEP3"
        title: "全社展開"
        body: "ガイドライン整備後、全部門で利用可能にする"

  - id: rollout_schedule
    type: timeline
    density: standard
    title: "展開の各作業がいつ重なるかを、四半期の軸で示す"
    primary_message: "ガイドライン整備を先行させ、第3四半期の全社展開に間に合わせる"
    periods: ["Q1", "Q2", "Q3", "Q4"]
    rows:
      - label: "ガイドライン"
        title: "入力範囲の整理と規程改定"
        start: 1
        end: 2
      - label: "部門展開"
        title: "類似業務を持つ4部門へ順次展開"
        start: 2
        end: 3
        tone: teal
      - label: "研修"
        title: "研修動画の作成と配信"
        start: 2
        end: 4
        tone: neutral
      - label: "全社展開"
        title: "全部門で利用可能にする"
        start: 3
        end: 4
        tone: brand

  - id: adoption_funnel
    type: funnel
    density: standard
    title: "利用定着までの人数の推移を追う"
    primary_message: "説明会参加から継続利用まで、離脱要因を段階ごとに把握する"
    stages:
      - title: "説明会案内"
        value: 320
        value_label: "320名"
      - title: "説明会参加"
        value: 210
        value_label: "210名 (66%)"
      - title: "PoC参加"
        value: 42
        value_label: "42名 (13%)"
      - title: "継続利用"
        value: 38
        value_label: "38名 (12%)"

  - id: continuous_improvement
    type: cycle
    density: standard
    title: "展開後も、利用状況を見ながら改善を続ける"
    primary_message: "一度の展開で終わらせず、四半期ごとに運用を見直す"
    steps:
      - label: "STEP1"
        title: "利用状況の把握"
      - label: "STEP2"
        title: "課題の洗い出し"
      - label: "STEP3"
        title: "ガイドライン改善"
      - label: "STEP4"
        title: "現場への展開"

  - id: remaining_risks
    type: priority_actions
    density: standard
    title: "本格展開に向けて対応が必要な課題を整理する"
    primary_message: "最優先の課題から、展開までに対応方針を確定する"
    issues:
      - priority: "最優先"
        title: "機密情報の入力制御"
        body: "部門展開に伴い、入力可能な情報範囲の再整理が必要"
      - priority: "高"
        title: "問い合わせ対応の体制"
        body: "利用者拡大に伴い、サポート窓口の拡充が必要"
      - priority: "中"
        title: "研修コンテンツの整備"
        body: "新規部門向けの利用研修を用意する"
    actions:
      - "入力制御ガイドラインを部門展開前に確定する"
      - "サポート窓口の体制を1名から3名へ拡充する"
      - "研修動画を作成し、自己学習できるようにする"

  - id: next_steps
    type: numbered_list
    density: standard
    message_position: bottom
    title: "本格展開に向けたご依頼事項"
    primary_message: "上記3点について、次回会議までにご承認をお願いします"
    items:
      - title: "部門展開の対象範囲承認"
        body: "第2四半期に展開する部門候補を確定する"
      - title: "予算の追加確保"
        body: "サポート体制拡充にかかる費用を承認する"
      - title: "推進担当者の任命"
        body: "各部門から1名、推進担当者を選任いただく"
